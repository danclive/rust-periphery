[package]
name          = "periphery"
version       = "0.2.0"
license       = "MIT"
authors       = ["danc <dangcheng@hotmail.com>"]
description   = "A Rust library for peripheral I/O (GPIO, PWM, SPI, I2C) in Linux."
documentation = "https://docs.rs/periphery"
homepage      = "https://github.com/danclive/rust-periphery"
repository    = "https://github.com/danclive/rust-periphery"
readme        = "README.md"
keywords      = ["gpio", "i2c", "spi", "pwm", "raspberry-pi"]
categories    = ["embedded", "hardware-support", "os::linux-apis"]
rust-version  = "1.85"
edition       = "2024"

[dependencies]
libc = "0.2"
